<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>
</head>
<body>

    <h1>Edit Product</h1>

    <form action="/update_product/{{ product.id }}" method="POST">

        <label>Product Name</label><br>
        <input
            type="text"
            name="name"
            value="{{ product.name }}">
        <br><br>

        <label>Price</label><br>
        <input
            type="number"
            name="price"
            value="{{ product.price }}">
        <br><br>

        <label>Category</label><br>
        <input
            type="text"
            name="category"
            value="{{ product.category }}">
        <br><br>

        <label>Stock</label><br>
        <input
            type="number"
            name="stock"
            value="{{ product.stock }}">
        <br><br>

        <label>Image</label><br>
        <input
            type="text"
            name="image"
            value="{{ product.image }}">
        <br><br>

        <label>Description</label><br>
        <textarea
            name="description"
            rows="5"
            cols="40">{{ product.description }}</textarea>
        <br><br>

        <button type="submit">
            Update Product
        </button>

    </form>

    <br>

    <a href="/admin">
        ⬅ Back to Admin
    </a>

</body>
</html>
